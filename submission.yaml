submission:
  title: "Sentinel D2: Zero-Trust Threat Intelligence"
  problem_statement: >
    Defence analysts receive thousands of alerts daily from SIEM systems and cyber sensors in different formats. No human team can read them all, and missing a genuine threat is catastrophic. Threat assessments must be produced in structured BLUF format for commanders.
  solution_summary: >
    Sentinel D2 ingests multi-source threat feeds via a Zero-Trust JWT API. It correlates alerts into an immutable cryptographic ledger to prevent tampering, maps attacker techniques to MITRE ATT&CK, and uses IBM Bob MCP to execute active containment scripts and generate BLUF summaries.
  key_features:
    - "Zero-Trust JWT alert ingestion pipeline"
    - "Cryptographic immutable threat ledger for tamper-proof logging"
    - "IBM Bob Shell MCP integration for active containment"
    - "Automated BLUF summary generation for commanders"
    - "MITRE ATT&CK lateral movement mapping"
  tech_stack:
    languages: ["JavaScript", "HTML", "CSS"]
    frameworks: ["Node.js", "Express"]
    ibm_technologies: ["IBM Bob", "IBM Bob Shell MCP"]
    databases: []
    other: ["JWT", "Crypto (SHA-256)"]
  what_we_are_most_proud_of: >
    We are proud of moving beyond a simple text-generation dashboard. By implementing a Zero-Trust JWT ingestion API and a cryptographic ledger, we built a load-bearing, military-grade architectural prototype rather than just a UI wrapper.
  known_limitations: >
    Currently, the system uses an in-memory array for the immutable ledger to allow for rapid prototyping. In a production environment, this will be migrated to a persistent database to maintain blockchain hash integrity across server reboots.

